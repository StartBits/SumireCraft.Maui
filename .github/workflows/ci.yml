name: CI

# Builds, tests and packs every pull request into main or a release branch. A pull request into
# main also has its versions checked, because merging it publishes whatever changed in a package
# (.github/scripts/check-versions.ps1).
#
# Run by hand (Run workflow, on the Actions tab) it does the same for any branch, and checks the
# versions only when given a base.
on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      base:
        description: 'Check versions against this commit, as a pull request into main based on it would be. Leave empty to skip the check.'
        required: false
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Read access alone, whatever the repository's default for workflows says. A pull request's code
# runs here, and none of it needs to write anything.
permissions:
  contents: read

# Every action is named by its full commit SHA, with its version in a comment beside it.
jobs:
  build:
    # Only a Windows runner can build all four TFMs (Android, iOS, MacCatalyst, Windows) at once
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags are needed to compare against the last release.
          fetch-depth: 0
          persist-credentials: false

      # The file policy and the characters a reader cannot see, as the commit check has them: a
      # commit made outside Claude Code never passed through that check.
      - name: Check files
        run: node .claude/hooks/check-commit.mjs --all

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows android ios maccatalyst

      # In the configuration it builds in: the Windows sample needs a runtime pack in Release alone,
      # and a build that does not restore cannot fetch it.
      - name: Restore
        run: dotnet restore SumireCraft.Maui.slnx -p:Configuration=Release

      # Run by hand with a base, so that the check can be tried on a try/ branch before a real pull
      # request depends on it.
      - name: Check versions
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || inputs.base != ''
        shell: pwsh
        # Through the environment rather than written into the script, because base is typed by hand.
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: ./.github/scripts/check-versions.ps1 -Base $env:BASE

      - name: Build
        run: dotnet build SumireCraft.Maui.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/SumireCraft.Maui.UnitTests/SumireCraft.Maui.UnitTests.csproj -c Release --no-build -- --report-xunit-trx --report-xunit-trx-filename test-results.trx

      - name: Pack
        run: dotnet pack SumireCraft.Maui.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/test-results.trx'
