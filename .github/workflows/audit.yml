name: NuGet audit

# Once a week, restores the solution and fails if a package it takes, a transitive one included, has
# a known vulnerability. Every restore audits already, but a finding there is a warning: the commit
# check stops on it, CI does not, and a week without a change runs neither. Here it is an error, and
# GitHub mails whoever last changed the schedule below.
#
# Pull requests are not held to this. A low advisory on a transitive package should not stop an
# urgent fix; what to do about one is the maintainer's call (Security, in CLAUDE.md).
#
# GitHub turns the schedule off after 60 days without activity in the repository; Enable workflow,
# on the Actions tab, turns it back on. Run workflow runs it at once.
on:
  schedule:
    - cron: '17 0 * * 1'  # Mondays at 00:17 UTC, off the hour when GitHub's queue is busiest
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

# Every action is named by its full commit SHA, with its version in a comment beside it, the same
# ones ci.yml names.
jobs:
  audit:
    # The libraries target all four platforms, and restoring them needs every workload.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows android ios maccatalyst

      # NU1901 to NU1904 are the four severities, low to critical. NU1900 is an audit that could not
      # reach its source and NU1905 a source that gave no vulnerability data, either of which would
      # otherwise pass as finding nothing. NuGetAuditMode=all, the .NET 10 default, is spelled out
      # because transitive packages are the point.
      - name: Restore and audit
        run: dotnet restore SumireCraft.Maui.slnx -p:Configuration=Release -p:NuGetAuditMode=all -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905
