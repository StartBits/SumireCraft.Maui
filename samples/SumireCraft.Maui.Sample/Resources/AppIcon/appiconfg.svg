<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Three violets in flower, the smaller two behind the largest, over a low cluster of leaves.

    Each flower carries five petals: two above, two to the sides, and a wider one below. That
    lowest petal is a shade deeper than the rest, which is how a real violet is built and what
    tells the shape apart from a daisy at small sizes.

    Written flat on purpose. The .NET MAUI resizer renders these through SkiaSharp, which does not
    follow <use> references, <defs> or CSS classes, so every shape carries its own fill.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">

    <!-- leaves -->
    <g fill="#7FAE86" fill-opacity="0.9">
        <g transform="translate(196,332) rotate(-25)"><ellipse cx="0" cy="-20" rx="9" ry="22" /></g>
        <g transform="translate(258,338) rotate(20)"><ellipse cx="0" cy="-18" rx="8" ry="20" /></g>
        <g transform="translate(300,262) rotate(55)"><ellipse cx="0" cy="-16" rx="7" ry="18" /></g>
    </g>

    <!-- furthest flower, smallest and palest -->
    <g transform="translate(152,300) rotate(-18) scale(0.55)">
        <g transform="rotate(-35)"><ellipse cx="0" cy="-20" rx="13" ry="26" fill="#C9B8EC" /></g>
        <g transform="rotate(35)"><ellipse cx="0" cy="-20" rx="13" ry="26" fill="#C9B8EC" /></g>
        <g transform="rotate(240)"><ellipse cx="0" cy="-24" rx="15" ry="30" fill="#C9B8EC" /></g>
        <g transform="rotate(120)"><ellipse cx="0" cy="-24" rx="15" ry="30" fill="#C9B8EC" /></g>
        <g transform="rotate(180)"><ellipse cx="0" cy="-28" rx="17" ry="34" fill="#AD95DB" /></g>
        <circle cx="0" cy="0" r="9" fill="#FFE9AE" />
    </g>

    <!-- middle flower -->
    <g transform="translate(322,290) rotate(14) scale(0.82)">
        <g transform="rotate(-35)"><ellipse cx="0" cy="-20" rx="13" ry="26" fill="#E4D9FA" /></g>
        <g transform="rotate(35)"><ellipse cx="0" cy="-20" rx="13" ry="26" fill="#E4D9FA" /></g>
        <g transform="rotate(240)"><ellipse cx="0" cy="-24" rx="15" ry="30" fill="#E4D9FA" /></g>
        <g transform="rotate(120)"><ellipse cx="0" cy="-24" rx="15" ry="30" fill="#E4D9FA" /></g>
        <g transform="rotate(180)"><ellipse cx="0" cy="-28" rx="17" ry="34" fill="#C9B3EF" /></g>
        <circle cx="0" cy="0" r="9" fill="#FFE08A" />
    </g>

    <!-- nearest flower, largest and white -->
    <g transform="translate(222,205) rotate(-6) scale(1.3)">
        <g transform="rotate(-35)"><ellipse cx="0" cy="-20" rx="13" ry="26" fill="#FFFFFF" /></g>
        <g transform="rotate(35)"><ellipse cx="0" cy="-20" rx="13" ry="26" fill="#FFFFFF" /></g>
        <g transform="rotate(240)"><ellipse cx="0" cy="-24" rx="15" ry="30" fill="#FFFFFF" /></g>
        <g transform="rotate(120)"><ellipse cx="0" cy="-24" rx="15" ry="30" fill="#FFFFFF" /></g>
        <g transform="rotate(180)"><ellipse cx="0" cy="-28" rx="17" ry="34" fill="#E9DDFF" /></g>
        <circle cx="0" cy="0" r="9" fill="#FFD966" />
    </g>

</svg>
